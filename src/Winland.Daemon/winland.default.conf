# Winland wrote this file on first start, because %USERPROFILE%\.winland\winland.conf
# was missing and no --config was given. Edit it and save: Winland reads it again.
# Run winland check [file] to validate a draft without changing your session.
#
# Alt+Tab, Win+L, Win+E, Win+Space and Win+Shift+S stay with Windows:
# switching windows, locking the screen, File Explorer, the input language,
# and the snipping tool.
#
# Every option and its default is in docs/behavior.md in the Winland repository:
# https://github.com/enpaze/winland/blob/main/docs/behavior.md

# Common changes. Each line shows the default. Remove the # and change the value.

# Space between windows, and between windows and the edge of the monitor.
# general:gaps_in = 4
# general:gaps_out = 8

# The border around a window. The focused window's border follows the Windows
# accent color until general:col.active_border is set, as in 0xff5599ff.
# general:border_size = 2
# general:col.inactive_border = 0xff404040

# How windows are arranged: dwindle splits the space in halves, and scrolling
# puts them in columns on a strip. floating leaves windows free of tiling.
# general:layout = dwindle

# Hide the taskbar, so windows use the space it takes.
# With it hidden, quit with winland exit.
# general:hide_taskbar = false

# Follow the window and monitor under the mouse. False keeps keyboard focus.
# input:follow_mouse = true

# Hide the cursor while typing, until the mouse moves.
# cursor:hide_on_key_press = true

# A rule for one kind of window, here File Explorer. winland inspect reads the
# window under the pointer and can draft a rule. A pattern matches the whole class.
# windowrule = float; size 1200 800, class:CabinetWClass

# Programs launched below.
# wt is Windows Terminal. explorer is File Explorer. notepad is Notepad.
# exec runs through cmd. start opens an https address, and Windows hands that
# address to the user's default browser.
$terminal = wt
$browser = start https://
$fileManager = explorer
$editor = notepad

# The modifier of the binds below. Win is the Windows key.
# Another modifier can collide with shortcuts of Windows or other apps; winland check does not see those.
# The quoted text on each bind is its description, which winland get binds lists.
$mod = Win

# Close the focused window. Win+W opens Widgets and Win+Q opens Search.
bind = $mod+W, "Close the window", close
bind = $mod+Q, "Close the window", close

# Swap the split direction. Win+J focuses a Windows tip when one is showing.
bind = $mod+J, "Flip the split direction", split

# Float or tile the focused window. Win+T cycles the apps on the taskbar.
bind = $mod+T, "Float or tile the window", float

# Full screen. Win+F opens Feedback Hub.
bind = $mod+F, "Full screen", fullscreen

# Maximize, which is fullscreen mode 1.
bind = $mod+Alt+F, "Maximize", maximize

# Float and pin. Both run, float first: a tile becomes a pinned float, and
# pressing again tiles it. A tile cannot stay pinned. Win+O locks rotation.
bind = $mod+O, "Pop the window out or tile it", float
bind = $mod+O, "Pin the popped-out window", pin

# The next Layout, and the previous one. Win+K opens Cast.
# Win+Alt+K mutes the microphone.
bind = $mod+K, "Next layout", layout next
bind = $mod+Alt+K, "Previous layout", layout prev

# Focus the window in that direction. Win+Arrows snap a window.
bind = $mod+Left, "Focus the window to the left", focus left
bind = $mod+Right, "Focus the window to the right", focus right
bind = $mod+Up, "Focus the window above", focus up
bind = $mod+Down, "Focus the window below", focus down

# The cursor hides on a key press, so it does not show where moving focus puts
# it, and comes back when the mouse moves.
cursor:hide_on_key_press = true

# Swap with the window in that direction.
# Win+Shift+Left and Win+Shift+Right move a window to another monitor.
bind = $mod+Shift+Left, "Swap with the window to the left", swap left
bind = $mod+Shift+Right, "Swap with the window to the right", swap right
bind = $mod+Shift+Up, "Swap with the window above", swap up
bind = $mod+Shift+Down, "Swap with the window below", swap down

# Move the focused window to the monitor in that direction.
bind = $mod+Ctrl+Shift+Left, "Move the window to the monitor to the left", move mon:left
bind = $mod+Ctrl+Shift+Right, "Move the window to the monitor to the right", move mon:right
bind = $mod+Ctrl+Shift+Up, "Move the window to the monitor above", move mon:up
bind = $mod+Ctrl+Shift+Down, "Move the window to the monitor below", move mon:down

# Move this monitor's workspace to the monitor in that direction.
bind = $mod+Alt+Shift+Left, "Move the workspace to the monitor to the left", move-workspace left
bind = $mod+Alt+Shift+Right, "Move the workspace to the monitor to the right", move-workspace right
bind = $mod+Alt+Shift+Up, "Move the workspace to the monitor above", move-workspace up
bind = $mod+Alt+Shift+Down, "Move the workspace to the monitor below", move-workspace down

# Workspaces 1 to 10 of this monitor. The 0 key is workspace 10.
# Win+1 through Win+0 open the apps pinned on the taskbar.
bind = $mod+1, "Switch to workspace 1", workspace 1
bind = $mod+2, "Switch to workspace 2", workspace 2
bind = $mod+3, "Switch to workspace 3", workspace 3
bind = $mod+4, "Switch to workspace 4", workspace 4
bind = $mod+5, "Switch to workspace 5", workspace 5
bind = $mod+6, "Switch to workspace 6", workspace 6
bind = $mod+7, "Switch to workspace 7", workspace 7
bind = $mod+8, "Switch to workspace 8", workspace 8
bind = $mod+9, "Switch to workspace 9", workspace 9
bind = $mod+0, "Switch to workspace 10", workspace 10

# Move the focused window to that workspace and follow it.
# Win+Shift+1 through Win+Shift+0 open a new window of a pinned app.
bind = $mod+Shift+1, "Move the window to workspace 1 and follow it", move 1
bind = $mod+Shift+2, "Move the window to workspace 2 and follow it", move 2
bind = $mod+Shift+3, "Move the window to workspace 3 and follow it", move 3
bind = $mod+Shift+4, "Move the window to workspace 4 and follow it", move 4
bind = $mod+Shift+5, "Move the window to workspace 5 and follow it", move 5
bind = $mod+Shift+6, "Move the window to workspace 6 and follow it", move 6
bind = $mod+Shift+7, "Move the window to workspace 7 and follow it", move 7
bind = $mod+Shift+8, "Move the window to workspace 8 and follow it", move 8
bind = $mod+Shift+9, "Move the window to workspace 9 and follow it", move 9
bind = $mod+Shift+0, "Move the window to workspace 10 and follow it", move 10

# Move the focused window there and stay on this workspace.
bind = $mod+Alt+Shift+1, "Move the window to workspace 1 and stay", move 1 stay
bind = $mod+Alt+Shift+2, "Move the window to workspace 2 and stay", move 2 stay
bind = $mod+Alt+Shift+3, "Move the window to workspace 3 and stay", move 3 stay
bind = $mod+Alt+Shift+4, "Move the window to workspace 4 and stay", move 4 stay
bind = $mod+Alt+Shift+5, "Move the window to workspace 5 and stay", move 5 stay
bind = $mod+Alt+Shift+6, "Move the window to workspace 6 and stay", move 6 stay
bind = $mod+Alt+Shift+7, "Move the window to workspace 7 and stay", move 7 stay
bind = $mod+Alt+Shift+8, "Move the window to workspace 8 and stay", move 8 stay
bind = $mod+Alt+Shift+9, "Move the window to workspace 9 and stay", move 9 stay
bind = $mod+Alt+Shift+0, "Move the window to workspace 10 and stay", move 10 stay

# Win+S opens Search.
bind = $mod+S, "Show or hide the scratchpad", scratchpad
bind = $mod+grave, "Show or hide the scratchpad", scratchpad

bind = $mod+Alt+S, "Move the window to the scratchpad", move special stay
bind = $mod+Shift+grave, "Move the window to the scratchpad", move special stay

# The next and previous workspace on this monitor. Win+Tab opens Task view.
bind = $mod+Tab, "Next workspace", workspace next
bind = $mod+Shift+Tab, "Previous workspace", workspace prev

bind = $mod+Ctrl+Tab, "Back to the last workspace", workspace last

# The previous monitor. Ctrl+Alt+Tab stays with the Windows window switcher.
bind = Ctrl+Alt+Shift+Tab, "Focus the previous monitor", focus-monitor prev

# Resize the focused window vertically by 100 pixels.
# Win+- and Win+= stay with Magnifier.
bind = $mod+Shift+minus, "Make the window shorter", resize 0 -100
bind = $mod+Shift+equal, "Make the window taller", resize 0 100

# Resize width or height by 25 pixels with Alt and by 300 with Ctrl.
bind = $mod+Alt+minus, "Make the window narrower", resize -25 0
bind = $mod+Alt+equal, "Make the window wider", resize 25 0
bind = $mod+Ctrl+minus, "Make the window much narrower", resize -300 0
bind = $mod+Ctrl+equal, "Make the window much wider", resize 300 0
bind = $mod+Alt+Shift+minus, "Make the window a little shorter", resize 0 -25
bind = $mod+Alt+Shift+equal, "Make the window a little taller", resize 0 25
bind = $mod+Ctrl+Shift+minus, "Make the window much shorter", resize 0 -300
bind = $mod+Ctrl+Shift+equal, "Make the window much taller", resize 0 300

# The wheel moves to the next or previous workspace on this monitor.
bind = $mod+mouse_down, "Next workspace", workspace next
bind = $mod+mouse_up, "Previous workspace", workspace prev

# Win and the left button drag a window. Win and the right button resize it.
# mouse:middle, mouse:x1 and mouse:x2 name the other buttons.
bind = $mod+mouse:left, "Drag to move the window", move
bind = $mod+mouse:right, "Drag to resize the window", resize

# Put the focused window in a Group, or take the Group apart. Win+G opens Game Bar.
bind = $mod+G, "Group the window or break up its group", group

# Take the focused window out of its Group.
bind = $mod+Alt+G, "Take the window out of its group", leave-group

# Join the Group in that direction.
bind = $mod+Alt+Left, "Join the group to the left", join left
bind = $mod+Alt+Right, "Join the group to the right", join right
bind = $mod+Alt+Up, "Join the group above", join up
bind = $mod+Alt+Down, "Join the group below", join down

# The next and previous member of the Group.
bind = $mod+Alt+Tab, "Next tab in the group", tab next
bind = $mod+Alt+Shift+Tab, "Previous tab in the group", tab prev

# The same on the arrow keys.
# Win+Ctrl+Left and Win+Ctrl+Right switch Windows desktops.
bind = $mod+Ctrl+Left, "Previous tab in the group", tab prev
bind = $mod+Ctrl+Right, "Next tab in the group", tab next

# And on the wheel.
bind = $mod+Alt+mouse_down, "Next tab in the group", tab next
bind = $mod+Alt+mouse_up, "Previous tab in the group", tab prev

# Show member 1 through 5.
# Win+Alt+1 through Win+Alt+5 open the jump list of a pinned app.
bind = $mod+Alt+1, "Go to tab 1 of the group", tab 1
bind = $mod+Alt+2, "Go to tab 2 of the group", tab 2
bind = $mod+Alt+3, "Go to tab 3 of the group", tab 3
bind = $mod+Alt+4, "Go to tab 4 of the group", tab 4
bind = $mod+Alt+5, "Go to tab 5 of the group", tab 5

# Launch a program.
bind = $mod+Return, "Open the terminal", exec $terminal
bind = $mod+Shift+Return, "Open the browser", exec $browser
bind = $mod+Shift+B, "Open the browser", exec $browser
bind = $mod+Shift+F, "Open the file manager", exec $fileManager
bind = $mod+Shift+N, "Open the editor", exec $editor

# Three fingers sideways switch workspace on this monitor.
# If Windows also acts on the swipe, open Settings, then Bluetooth & devices,
# then Touchpad, and set three-finger Swipes to Nothing. The installer may
# already have done this.
gesture = 3, horizontal, workspace

# Window movement takes 300 ms; fades and workspace transitions take 800 ms.
# A window Winland closes goes at once.
# animations:enabled = true
