# Winland wrote this file on first start, because %USERPROFILE%\.winland\winland.conf
# was missing and no --config was given. Edit it and save: Winland reads it again.
#
# Alt+Tab, Win+L, Win+E, Win+Space and Win+Shift+S stay with Windows:
# switching windows, locking the screen, File Explorer, the input language,
# and the snipping tool.
#
# Every option and its default is in docs/behavior.md in the Winland repository:
# https://github.com/enpaze/winland/blob/main/docs/behavior.md

# Common changes. Each line shows the default. Remove the # and change the value.

# Space between windows, and between windows and the edge of the monitor.
# general:gaps_in = 4
# general:gaps_out = 8

# The border around a window. The focused window's border follows the Windows
# accent color until general:col.active_border is set, as in 0xff5599ff.
# general:border_size = 2
# general:col.inactive_border = 0xff404040

# How windows are arranged: dwindle splits the space in halves, and scrolling
# puts them in columns on a strip.
# general:layout = dwindle

# Hide the taskbar, so windows use the space it takes.
# With it hidden, quit with winland dispatch exit.
# general:hide_taskbar = false

# 1 focuses the window under the mouse. 0 moves focus only when crossing
# between a floating and a tiled window. 3 never follows the mouse.
# input:follow_mouse = 1

# A rule for one kind of window, here File Explorer. winland activewindow shows
# the class of the focused window. A pattern must match the whole class.
# windowrule = float, class:CabinetWClass

# Programs launched below.
# wt is Windows Terminal. explorer is File Explorer. notepad is Notepad.
# exec runs through cmd. start opens an https address, and Windows hands that
# address to the user's default browser.
$terminal = wt
$browser = start https://
$fileManager = explorer
$editor = notepad

# The modifier of the binds below. SUPER is the Windows key.
# Each bindd line also has a description, which winland binds lists.
$mainMod = SUPER

# Close the focused window. Win+W opens Widgets and Win+Q opens Search.
bindd = $mainMod, W, Close the window, killactive
bindd = $mainMod, Q, Close the window, killactive

# Swap the split direction. Win+J focuses a Windows tip when one is showing.
# A split keeps the direction it was given only with preserve_split on.
dwindle:preserve_split = true
bindd = $mainMod, J, Flip the split direction, togglesplit

# Show the focused window at its own size, centered in its tile. Win+P is Project.
bindd = $mainMod, P, Show the window at its own size, pseudo

# Float or tile the focused window. Win+T cycles the apps on the taskbar.
bindd = $mainMod, T, Float or tile the window, togglefloating

# Full screen. Win+F opens Feedback Hub.
bindd = $mainMod, F, Full screen, fullscreen

# Maximize, which is fullscreen mode 1.
bindd = $mainMod ALT, F, Maximize, fullscreen, 1

# Float and pin. Both run, float first: a tile becomes a pinned float, and
# pressing again tiles it. A tile cannot stay pinned. Win+O locks rotation.
bindd = $mainMod, O, Pop the window out or tile it, togglefloating
bindd = $mainMod, O, Pin the popped-out window, pin

# The next Layout, and the previous one. Win+K opens Cast.
# Win+Alt+K mutes the microphone.
bindd = $mainMod, K, Next layout, cyclelayout
bindd = $mainMod ALT, K, Previous layout, cyclelayout, back

# Focus the window in that direction. Win+Arrows snap a window.
bindd = $mainMod, Left, Focus the window to the left, movefocus, l
bindd = $mainMod, Right, Focus the window to the right, movefocus, r
bindd = $mainMod, Up, Focus the window above, movefocus, u
bindd = $mainMod, Down, Focus the window below, movefocus, d

# The cursor hides on a key press, so it does not show where moving focus puts
# it, and comes back when the mouse moves.
cursor:hide_on_key_press = true

# Swap with the window in that direction.
# Win+Shift+Left and Win+Shift+Right move a window to another monitor.
bindd = $mainMod SHIFT, Left, Swap with the window to the left, swapwindow, l
bindd = $mainMod SHIFT, Right, Swap with the window to the right, swapwindow, r
bindd = $mainMod SHIFT, Up, Swap with the window above, swapwindow, u
bindd = $mainMod SHIFT, Down, Swap with the window below, swapwindow, d

# Move the focused window to the monitor in that direction.
bindd = $mainMod SHIFT CTRL, Left, Move the window to the monitor to the left, movewindow, mon:l
bindd = $mainMod SHIFT CTRL, Right, Move the window to the monitor to the right, movewindow, mon:r
bindd = $mainMod SHIFT CTRL, Up, Move the window to the monitor above, movewindow, mon:u
bindd = $mainMod SHIFT CTRL, Down, Move the window to the monitor below, movewindow, mon:d

# Move this monitor's workspace to the monitor in that direction.
bindd = $mainMod SHIFT ALT, Left, Move the workspace to the monitor to the left, movecurrentworkspacetomonitor, l
bindd = $mainMod SHIFT ALT, Right, Move the workspace to the monitor to the right, movecurrentworkspacetomonitor, r
bindd = $mainMod SHIFT ALT, Up, Move the workspace to the monitor above, movecurrentworkspacetomonitor, u
bindd = $mainMod SHIFT ALT, Down, Move the workspace to the monitor below, movecurrentworkspacetomonitor, d

# Workspaces 1 to 10 of this monitor. The 0 key is workspace 10.
# Win+1 through Win+0 open the apps pinned on the taskbar.
bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Switch to workspace 8, workspace, 8
bindd = $mainMod, 9, Switch to workspace 9, workspace, 9
bindd = $mainMod, 0, Switch to workspace 10, workspace, 10

# Move the focused window to that workspace and follow it.
# Win+Shift+1 through Win+Shift+0 open a new window of a pinned app.
bindd = $mainMod SHIFT, 1, Move the window to workspace 1 and follow it, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move the window to workspace 2 and follow it, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move the window to workspace 3 and follow it, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move the window to workspace 4 and follow it, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move the window to workspace 5 and follow it, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move the window to workspace 6 and follow it, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move the window to workspace 7 and follow it, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move the window to workspace 8 and follow it, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move the window to workspace 9 and follow it, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move the window to workspace 10 and follow it, movetoworkspace, 10

# Move the focused window there and stay on this workspace.
bindd = $mainMod SHIFT ALT, 1, Move the window to workspace 1 and stay, movetoworkspacesilent, 1
bindd = $mainMod SHIFT ALT, 2, Move the window to workspace 2 and stay, movetoworkspacesilent, 2
bindd = $mainMod SHIFT ALT, 3, Move the window to workspace 3 and stay, movetoworkspacesilent, 3
bindd = $mainMod SHIFT ALT, 4, Move the window to workspace 4 and stay, movetoworkspacesilent, 4
bindd = $mainMod SHIFT ALT, 5, Move the window to workspace 5 and stay, movetoworkspacesilent, 5
bindd = $mainMod SHIFT ALT, 6, Move the window to workspace 6 and stay, movetoworkspacesilent, 6
bindd = $mainMod SHIFT ALT, 7, Move the window to workspace 7 and stay, movetoworkspacesilent, 7
bindd = $mainMod SHIFT ALT, 8, Move the window to workspace 8 and stay, movetoworkspacesilent, 8
bindd = $mainMod SHIFT ALT, 9, Move the window to workspace 9 and stay, movetoworkspacesilent, 9
bindd = $mainMod SHIFT ALT, 0, Move the window to workspace 10 and stay, movetoworkspacesilent, 10

# Show or hide the special workspace named scratchpad.
# Win+S opens Search.
bindd = $mainMod, S, Show or hide the scratchpad, togglespecialworkspace, scratchpad
bindd = $mainMod, grave, Show or hide the scratchpad, togglespecialworkspace, scratchpad

# Move the focused window onto that special workspace and stay here.
bindd = $mainMod ALT, S, Move the window to the scratchpad, movetoworkspacesilent, special:scratchpad
bindd = $mainMod SHIFT, grave, Move the window to the scratchpad, movetoworkspacesilent, special:scratchpad

# The next and previous workspace on this monitor. Win+Tab opens Task view.
bindd = $mainMod, Tab, Next workspace, workspace, m+1
bindd = $mainMod SHIFT, Tab, Previous workspace, workspace, m-1

# The workspace this monitor showed before this one.
bindd = $mainMod CTRL, Tab, Back to the last workspace, workspace, previous_per_monitor

# The previous monitor. Ctrl+Alt+Tab stays with the Windows window switcher.
bindd = CTRL ALT SHIFT, Tab, Focus the previous monitor, focusmonitor, -1

# Resize the focused window vertically by 100 pixels.
# Win+- and Win+= stay with Magnifier.
bindd = $mainMod SHIFT, minus, Make the window shorter, resizeactive, 0 -100
bindd = $mainMod SHIFT, equal, Make the window taller, resizeactive, 0 100

# Resize width or height by 25 pixels with Alt and by 300 with Ctrl.
bindd = $mainMod ALT, minus, Make the window narrower, resizeactive, -25 0
bindd = $mainMod ALT, equal, Make the window wider, resizeactive, 25 0
bindd = $mainMod CTRL, minus, Make the window much narrower, resizeactive, -300 0
bindd = $mainMod CTRL, equal, Make the window much wider, resizeactive, 300 0
bindd = $mainMod SHIFT ALT, minus, Make the window a little shorter, resizeactive, 0 -25
bindd = $mainMod SHIFT ALT, equal, Make the window a little taller, resizeactive, 0 25
bindd = $mainMod SHIFT CTRL, minus, Make the window much shorter, resizeactive, 0 -300
bindd = $mainMod SHIFT CTRL, equal, Make the window much taller, resizeactive, 0 300

# The wheel moves to the next or previous workspace on this monitor.
bindd = $mainMod, mouse_down, Next workspace, workspace, m+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, m-1

# Win and the left button drag a window. Win and the right button resize it.
# mouse:middle, mouse:x1 and mouse:x2 name the other buttons.
bindmd = $mainMod, mouse:left, Drag to move the window, movewindow
bindmd = $mainMod, mouse:right, Drag to resize the window, resizewindow

# Put the focused window in a Group, or take the Group apart. Win+G opens Game Bar.
bindd = $mainMod, G, Group the window or break up its group, togglegroup

# Take the focused window out of its Group.
bindd = $mainMod ALT, G, Take the window out of its group, moveoutofgroup

# Join the Group in that direction.
bindd = $mainMod ALT, Left, Join the group to the left, moveintogroup, l
bindd = $mainMod ALT, Right, Join the group to the right, moveintogroup, r
bindd = $mainMod ALT, Up, Join the group above, moveintogroup, u
bindd = $mainMod ALT, Down, Join the group below, moveintogroup, d

# The next and previous member of the Group.
bindd = $mainMod ALT, Tab, Next tab in the group, changegroupactive, f
bindd = $mainMod ALT SHIFT, Tab, Previous tab in the group, changegroupactive, b

# The same on the arrow keys.
# Win+Ctrl+Left and Win+Ctrl+Right switch Windows desktops.
bindd = $mainMod CTRL, Left, Previous tab in the group, changegroupactive, b
bindd = $mainMod CTRL, Right, Next tab in the group, changegroupactive, f

# And on the wheel.
bindd = $mainMod ALT, mouse_down, Next tab in the group, changegroupactive, f
bindd = $mainMod ALT, mouse_up, Previous tab in the group, changegroupactive, b

# Show member 1 through 5.
# Win+Alt+1 through Win+Alt+5 open the jump list of a pinned app.
bindd = $mainMod ALT, 1, Go to tab 1 of the group, changegroupactive, 1
bindd = $mainMod ALT, 2, Go to tab 2 of the group, changegroupactive, 2
bindd = $mainMod ALT, 3, Go to tab 3 of the group, changegroupactive, 3
bindd = $mainMod ALT, 4, Go to tab 4 of the group, changegroupactive, 4
bindd = $mainMod ALT, 5, Go to tab 5 of the group, changegroupactive, 5

# Ask every window to close.
# bindd = $mainMod CTRL ALT, W, Ask every window to close, closeall

# Launch a program.
bindd = $mainMod, Return, Open the terminal, exec, $terminal
bindd = $mainMod SHIFT, Return, Open the browser, exec, $browser
bindd = $mainMod SHIFT, B, Open the browser, exec, $browser
bindd = $mainMod SHIFT, F, Open the file manager, exec, $fileManager
bindd = $mainMod SHIFT, N, Open the editor, exec, $editor

# Three fingers sideways switch workspace on this monitor.
# If Windows also acts on the swipe, open Settings, then Bluetooth & devices,
# then Touchpad, and set three-finger Swipes to Nothing. The installer may
# already have done this.
gesture = 3, horizontal, workspace

# Windows open, close and move into place in 300 ms. Without this line they
# take 800 ms, and the last few pixels crawl in for most of that time.
animation = windows, 1, 3, default

# A window Winland closes goes at once, and the windows beside it move into
# its space without waiting for it to shrink and fade out.
animation = windowsOut, 0
animation = fadeOut, 0
