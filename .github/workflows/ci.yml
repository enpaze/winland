name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Release run: no push cancels it"
        type: boolean
        default: false
      ref:
        description: "Commit to test. Empty means the event's own commit."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.release || false }}-${{ inputs.ref || github.ref }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release && (github.event_name == 'pull_request' || github.event_name == 'push') }}

jobs:
  check:
    name: All required checks pass (v1)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NUGET_PACKAGES: C:/nuget
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Find the .NET SDK
        id: sdk
        shell: pwsh
        run: |
          $version = dotnet --version 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Using the preinstalled .NET SDK $version."
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output 'No preinstalled .NET SDK matches global.json.'
            "found=false" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - if: steps.sdk.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore the NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: C:/nuget
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Classify the diff
        id: classify
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          if ($env:EVENT_NAME -ne 'pull_request') {
            "test=true" >> $env:GITHUB_OUTPUT
            Write-Output 'test lane: true (fail open)'
            exit 0
          }
          $files = @(git diff --name-only --no-renames "origin/$($env:BASE_REF)...$($env:HEAD_SHA)")
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with $LASTEXITCODE" }
          $docs = '^(.*\.md|docs/.*|\.github/ISSUE_TEMPLATE/.*|\.github/rulesets/.*|\.gitignore|\.gitattributes|LICENSE.*)$'
          $code = @($files | Where-Object { $_ -and $_ -cnotmatch $docs })
          $test = if ($code.Count -gt 0) { 'true' } else { 'false' }
          "test=$test" >> $env:GITHUB_OUTPUT
          Write-Output "test lane: $test"
      - name: Run lint
        shell: pwsh
        env:
          TEST: ${{ steps.classify.outputs.test }}
        run: |
          ./scripts/check.ps1 -SkipBuild:($env:TEST -eq 'false')
          exit $LASTEXITCODE
      - name: Lint the workflows
        shell: pwsh
        run: |
          $version = '1.7.12'
          $sha256 = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          $zipName = "actionlint_${version}_windows_amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $zipName
          $dir = Join-Path $env:RUNNER_TEMP 'actionlint'
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$version/$zipName" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($actual -ne $sha256) {
            throw "$zipName has SHA-256 $actual, expected $sha256."
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $files = Get-ChildItem -Path .github/workflows -Filter *.yml | ForEach-Object { $_.FullName }
          & (Join-Path $dir 'actionlint.exe') @files
          if ($LASTEXITCODE -ne 0) {
            throw "actionlint reported problems (exit code $LASTEXITCODE)."
          }
      - name: Run tests
        if: steps.classify.outputs.test == 'true'
        shell: pwsh
        run: ./scripts/test.ps1 -NoBuild
